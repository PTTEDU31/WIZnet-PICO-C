<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power Monitor</title>
  <link rel="stylesheet" href="/style.css" />
  <script defer src="/script.js"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>⚡ Power Monitor</h1>
      <button id="themeToggle" onclick="toggleTheme()">🌙</button>
    </div>

    <!-- Tabs -->
    <div class="tab">
      <button class="tablink active" onclick="openTab(event, 'statusTab')">Status</button>
      <button class="tablink" onclick="openTab(event, 'settingsTab')">Settings</button>
      <button class="tablink" onclick="openTab(event, 'deviceTab')">Device Info</button>
      <button class="tablink" onclick="openTab(event, 'logsTab')">Logs</button>
    </div>

    <!-- STATUS -->
    <div id="statusTab" class="tabcontent">
      <div id="spinner" class="spinner" style="display:none;"></div>
      <table id="statusTable">
        <tr>
          <th>Parameter</th>
          <th>Value</th>
        </tr>
        <tr>
          <td>Vin</td>
          <td id="vin">--</td>
        </tr>
        <tr>
          <td>Vout</td>
          <td id="vout">--</td>
        </tr>
        <tr>
          <td>Iout</td>
          <td id="iout">--</td>
        </tr>
        <tr>
          <td>Temperature</td>
          <td id="temp">--</td>
        </tr>
        <tr>
          <td>Fault Raw</td>
          <td id="fault_raw">--</td>
        </tr>
        <p><strong>Fault Detail:</strong> <span id="fault_detail">--</span></p>
      </table>
      <div class="footer">Auto-refresh every 30s</div>
    </div>

    <!-- SETTINGS -->
    <div id="settingsTab" class="tabcontent" style="display:none">
      <form id="networkForm">
        <label>DHCP Mode:</label>
        <select id="dhcp">
          <option value="1">Enable (Auto IP)</option>
          <option value="0">Disable (Static IP)</option>
        </select>

        <label>IP Address:</label>
        <input type="text" id="ip" placeholder="192.168.1.100" />

        <label>Subnet Mask:</label>
        <input type="text" id="mask" placeholder="255.255.255.0" />

        <label>Gateway:</label>
        <input type="text" id="gw" placeholder="192.168.1.1" />

        <label>DNS Server:</label>
        <input type="text" id="dns" placeholder="8.8.8.8" />

        <button type="button" onclick="saveNetwork()">💾 Save</button>
      </form>

      <div id="saveStatus"></div>
    </div>


    <!-- DEVICE INFO -->
    <div id="deviceTab" class="tabcontent" style="display:none">
      <div id="spinnerDev" class="spinner" style="display:none;"></div>
      <table>
        <tr>
          <td>MAC Address</td>
          <td id="mac">--</td>
        </tr>
        <tr>
          <td>Firmware</td>
          <td id="fw">--</td>
        </tr>
        <tr>
          <td>Board</td>
          <td id="board">--</td>
        </tr>
        <tr>
          <td>Uptime</td>
          <td id="uptime">--</td>
        </tr>
        <tr>
          <td>Last Sync</td>
          <td id="sync">--</td>
        </tr>
      </table>
      <button onclick="refreshDevice()">🔄 Refresh</button>
    </div>

    <!-- LOGS -->
    <div id="logsTab" class="tabcontent" style="display:none;">
      <div class="log-header">
        <button onclick="refreshLogs()">🔄 Refresh</button>
        <button onclick="clearLogs()">🧹 Clear</button>
        <label class="autoToggle">
          <input type="checkbox" id="autoScroll" checked /> Auto-scroll
        </label>
        <label class="autoToggle">
          <input type="checkbox" id="autoRefresh" checked /> Auto-refresh
        </label>
      </div>
      <div id="spinnerLogs" class="spinner" style="display:none;"></div>
      <div id="logContainer" class="log-container">Loading logs...</div>
    </div>
  </div>

  <!-- CONFIRM POPUP -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <p>💾 Save new network configuration?</p>
      <button onclick="saveNetwork()">Yes</button>
      <button onclick="closePopup()">Cancel</button>
    </div>
  </div>
</body>

</html>
